name: donexia
description: "Donexia — A Small Help. A Big Difference. India-focused social help and donation platform (Flutter, demo build, no backend, no real payments)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.20.3
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
